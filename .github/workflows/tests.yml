name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The interface is a web page and the figures are drawn off-screen, so
      # there is no desktop toolkit to install system libraries for.
      - name: Install the package and its development extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the tests
        run: pytest -q

      - name: Lint
        run: ruff check .

  wheel:
    # The static files travel as package data; a wheel without them serves a
    # blank page, and the tests, which run from the source tree, would not notice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel and use it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/lythos-settle --version
          /tmp/check/bin/lythos-settle example -o /tmp/check.settle
          /tmp/check/bin/lythos-settle run /tmp/check.settle -o /tmp/check.pdf
          test -s /tmp/check.pdf

      - name: The interface's files must be inside the wheel
        run: |
          /tmp/check/bin/python - <<'PY'
          import os
          from lythossettle.web import server
          for name in ("index.html", "app.js", "style.css"):
              path = os.path.join(server.STATIC, name)
              assert os.path.isfile(path), f"{name} is missing from the wheel"
          print("package data is complete")
          PY
